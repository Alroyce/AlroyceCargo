<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=2.0">
    <title>Local Parcel Booking</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="booking-container">
        <h2>📦 Local Parcel Booking</h2>
        <p class="subtitle">Schedule your same-day local delivery instantly.</p>

        <form action="#" method="POST">
            
            <!-- Section 1: Pickup Details -->
            <div class="form-section">
                <h3>📍 Pickup Information</h3>
                
                <div class="form-group">
                    <label for="sender-name">Sender's Full Name</label>
                    <input type="text" id="sender-name" name="sender_name" placeholder="John Doe" required>
                </div>

                <div class="form-group-row">
                    <div class="form-group">
                        <label for="sender-phone">Phone Number</label>
                        <input type="tel" id="sender-phone" name="sender_phone" placeholder="98765 43210" required>
                    </div>
                    <div class="form-group">
                        <label for="pickup-time">Preferred Pickup Time</label>
                        <input type="time" id="pickup-time" name="pickup_time" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="pickup-address">Complete Address</label>
                    <textarea id="pickup-address" name="pickup_address" rows="3" placeholder="Flat, Street name, Landmark, Postal Code" required></textarea>
                </div>
            </div>

            <!-- Section 2: Delivery Details -->
            <div class="form-section">
                <h3>🏁 Delivery Information</h3>
                
                <div class="form-group">
                    <label for="receiver-name">Receiver's Full Name</label>
                    <input type="text" id="receiver-name" name="receiver_name" placeholder="Jane Smith" required>
                </div>

                <div class="form-group">
                    <label for="receiver-phone">Phone Number</label>
                    <input type="tel" id="receiver-phone" name="receiver_phone" placeholder="98765 12345" required>
                </div>

                <div class="form-group">
                    <label for="delivery-address">Complete Address</label>
                    <textarea id="delivery-address" name="delivery_address" rows="3" placeholder="Flat, Street name, Landmark, Postal Code" required></textarea>
                </div>
            </div>

            <!-- Section 3: Parcel Specs -->
            <div class="form-section">
                <h3>📦 Parcel Specifications</h3>
                
                <div class="form-group-row">
                    <div class="form-group">
                        <label for="parcel-type">Category</label>
                        <select id="parcel-type" name="parcel_type" required>
                            <option value="" disabled selected>Select option</option>
                            <option value="documents">Documents / Food</option>
                            <option value="clothes">Clothes / Shoes</option>
                            <option value="electronics">Electronics</option>
                            <option value="fragile">Fragile items</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="parcel-weight">Weight Range</label>
                        <select id="parcel-weight" name="parcel_weight" required>
                            <option value="" disabled selected>Select weight</option>
                            <option value="0-2">Up to 2 kg</option>
                            <option value="2-5">2 kg - 5 kg</option>
                            <option value="5-10">5 kg - 10 kg</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="instructions">Special Instructions (Optional)</label>
                    <input type="text" id="instructions" name="instructions" placeholder="e.g. Leave with security, fragile contents">
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="submit-btn">Confirm Booking</button><br><br>

             <div class="btn-container no-print">
        <button class="print-btn" onclick="window.print()">🖨️ Confirm and Print</button>
    </div>
        </form>
    </div>

</body>
</html>
