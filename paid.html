<html>
    <head>
        <title>Home Page</title>
        <link rel="stylesheet" href="style.css">
       
    </head>
    <body>       
<div class="container">
    <ul>
        <li><a href="index.html">HOME</a></li>
        <li><a href="topay.html">To Pay</a></li>
        <li><a href="paid.html">Paid</a></li>
        <li><a href="tripsheet.html">Trip Sheet</a></li>
        <li><a href="bookings.html">Bookings</a></li>
        <li><a href="about.html">About</a></li>
    </ul>
</div>
    
<div class="header">

    <h1>PAID</h1>

    <div class="meta-info">
        <p>
            LR Number:
            <span id="lrNumber"></span>
        </p>

        <p>
            Date:
            <span id="lrdate"></span>
        </p>
    </div>

</div>

    <div class="lrform">
        <div class="form1">
            <label for="from-input">From</label>
            <input type="text" placeholder="Enter the source place">
            <label for="to1">To</label>
            <input type="text" placeholder="Enter the Destination place">
        </div>
    </div>   
    <div class="lrdetails">
        
    <div class="form-section">
    <label>Consignor (From)</label>

    <div class="inline-fields">
        <input type="text" class="input-box" placeholder="Sender Name">
        <input type="number" class="input-box" placeholder="Contact No">
    </div>

    <input type="text" class="input-box" placeholder="GST Details">
    <input type="text" class="input-box" placeholder="Address">
</div>

   <div class="form-section">
    <label>Consignor (From)</label>

    <div class="inline-fields">
        <input type="text" class="input-box" placeholder="Sender Name">
        <input type="number" class="input-box" placeholder="Contact No">
    </div>

    <input type="text" class="input-box" placeholder="GST Details">
    <input type="text" class="input-box" placeholder="Address">
</div>
    
</div>

<div class="booking-container">

    <!-- Left Side -->
    <div class="article-section">
        <h3>Article Booking Details</h3>

        <form action="/submit-booking" method="post">
            <table id="parcelTable">
                <thead>
                    <tr>
                        <th>Quantity</th>
                        <th>Goods Description</th>
                        <th>Weight (kg)</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td><input type="number" placeholder="Qty"></td>
                        <td><input type="text" placeholder="Goods"></td>
                        <td><input type="number" placeholder="Weight"></td>
                        <td><button type="button" onclick="removeRow(this)">Remove</button></td>
                    </tr>
                </tbody>
            </table>

            <button type="button" id="addGoods">Add More Goods</button>
        </form>
    </div>

    <!-- Right Side -->
    <div class="charges-section">
        <h3>Charges</h3>

        <table class="charges-table">
            <tr><td>Freight</td><td><input type="number" placeholder="0"></td></tr>
            <tr><td>Hamali</td><td><input type="number" placeholder="0"></td></tr>
            <tr><td>Stationary</td><td><input type="number" placeholder="0"></td></tr>
            <tr><td>Door Delivery</td><td><input type="number" placeholder="0"></td></tr>
            <tr><td>Others</td><td><input type="number" placeholder="0"></td></tr>
            <tr><td>Total</td><td><input type="number" placeholder="0"></td></tr>
            <tr><td>GST 5%</td><td><input type="number" placeholder="0"></td></tr>
            <tr><td>IGST 5%</td><td><input type="number" placeholder="0"></td></tr>
            <tr><td><strong>Grand Total</strong></td><td><input type="number" placeholder="0"></td></tr>
        </table>
    </div>
</div>

<div class="booking-container">
    <div class="details-wrapper">

    <div id="form-group1">
        <div>
            <label>Actual Wt</label>
            <input type="number" class="small-input" placeholder="0">
        </div>

        <div>
            <label>Charged Wt</label>
            <input type="number" class="small-input" placeholder="0">
        </div>

        <div>
            <label>Wt Rate</label>
            <input type="number" class="small-input" placeholder="0">
        </div>

        <div>
            <label>Wt Amt</label>
            <input type="number" class="small-input" placeholder="0">
        </div>

        <div>
            <label>Fix Amt</label>
            <input type="number" class="small-input" placeholder="0">
        </div>
    </div>

    <div id="form-group2">
        <input type="number" class="small-input" placeholder="Invoice No">

        <input type="number" class="small-input" placeholder="Declared Value">

        <input type="text" class="small-input" placeholder="Remarks">
    </div>

</div>        


<div class="delivery-box">
        <div class="field">
            <label>Delivery At</label>
            <select class="small-input">
                <option>Godown</option>
                <option>Office</option>
                <option>Party</option>
            </select>
        </div>

        <div class="field">
            <label>Booked By</label>
            <input type="text" class="small-input" placeholder="Bookie Name">
        </div>
    </div>
</div>

     <div id="form-group4">
        <button onclick="window.print()">Save & Print</button>
        <button type="button" onclick="clearsection()">Clear</button>
     </div>

     <script src="script.js"></script>
    </body>
</html>
