<html>
<head>
        <title>Home Page</title>
        <link rel="stylesheet" href="tripsheet.css">
        <script>
function clearForm() {

    // Clear all input fields
    document.querySelectorAll(".tripform input").forEach(input => {

        if (input.type === "checkbox" || input.type === "radio") {
            input.checked = false;
        } else {
            input.value = "";
        }

    });

    // Reset all select elements (if any)
    document.querySelectorAll(".tripform select").forEach(select => {
        select.selectedIndex = 0;
    });

}
</script>
</head>
<body>
<div class="container">

</div>

</div>

</body>
